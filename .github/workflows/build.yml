name: Build Flet Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # أو إذا لم يكن لديك ملف requirements.txt، استبدل السطر السابق بـ:
        # pip install flet>=0.21.0

    - name: Build Android APK with Flet (Non-Interactive)
      run: |
        export CI="true"
        flet build apk --verbose

    - name: Fix App Name in AndroidManifest (Arabic Support)
      run: |
        python -c '
        import glob
        # البحث عن ملف الـ AndroidManifest الناتج في مجلد البناء المؤقت
        manifests = glob.glob("**/AndroidManifest.xml", recursive=True)
        updated = False
        for m in manifests:
            if "build" in m or ".flet" in m:
                with open(m, "r", encoding="utf-8") as f:
                    content = f.read()
                
                # استبدال التسمية الافتراضية بالاسم العربي المطلوب
                if "android:label=" in content:
                    import re
                    # استبدال أي label قديم بالاسم العربي لنادي الأمل
                    content = re.sub(r"android:label=\"([^\"]+)\"", "android:label=\"نادي الأمل\"", content)
                    with open(m, "w", encoding="utf-8") as f:
                        f.write(content)
                    print(f"Successfully updated: {m}")
                    updated = True
        if not updated:
            print("Warning: AndroidManifest.xml not found for modification!")
        '

    - name: Rebuild or Finalize APK (if needed) or Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: |
          build/apk/output/*.apk
          build/sapk/output/*.apk
          **/output/*.apk
